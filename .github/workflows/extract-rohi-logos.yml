name: Extract ROHI logo assets

on:
  push:
    branches:
      - main
    paths:
      - "ROHI_VTTI_5_Transparent_Logo_Assets (6).zip"
      - ".github/workflows/extract-rohi-logos.yml"

permissions:
  contents: write

jobs:
  extract-logos:
    if: github.event.head_commit.message != 'Extract five ROHI logos from uploaded ZIP'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract the five PNG logos into repository root
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path

          archive = Path("ROHI_VTTI_5_Transparent_Logo_Assets (6).zip")
          expected = [
              "01-rohi-vtti.png",
              "02-pakistan-national-emblem.png",
              "03-government-of-pakistan.png",
              "04-navttc.png",
              "05-prime-ministers-youth-programme.png",
          ]
          with zipfile.ZipFile(archive) as z:
              names = set(z.namelist())
              missing = [name for name in expected if name not in names]
              if missing:
                  raise SystemExit(f"Missing logo files in ZIP: {missing}")
              for name in expected:
                  Path(name).write_bytes(z.read(name))
                  print(f"Extracted {name}")
          PY

      - name: Commit extracted logos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 01-rohi-vtti.png 02-pakistan-national-emblem.png 03-government-of-pakistan.png 04-navttc.png 05-prime-ministers-youth-programme.png
          if git diff --cached --quiet; then
            echo "Logo files are already up to date."
          else
            git commit -m "Extract five ROHI logos from uploaded ZIP"
            git push
          fi
