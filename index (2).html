<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ROHI VTTI | Vocational & Technical Training Institute | Multan</title>

    <meta name="description"
          content="ROHI Vocational & Technical Training Institute Multan - NAVTTC affiliated training institute offering professional technical, IT and beauty courses.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>

        /* =========================
           ROOT
        ========================= */

        :root {
            --primary: #004a99;
            --primary-dark: #00356f;
            --secondary: #28a745;
            --secondary-dark: #1e7e34;
            --gold: #ffcc00;
            --dark: #101828;
            --text: #344054;
            --light: #f8fafc;
            --white: #ffffff;
            --danger: #ef4444;
            --border: #e4e7ec;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Poppins', sans-serif;
            color: var(--text);
            background: #fff;
            line-height: 1.7;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        img {
            max-width: 100%;
            display: block;
        }

        .container {
            width: min(1180px, 92%);
            margin: auto;
        }


        /* =========================
           TOP BAR
        ========================= */

        .top-bar {
            background: var(--dark);
            color: #fff;
            padding: 8px 0;
            font-size: 13px;
        }

        .top-bar-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .top-bar span {
            display: inline-flex;
            align-items: center;
            gap: 7px;
        }


        /* =========================
           NOTICE BAR
        ========================= */

        .notice-bar {
            background: linear-gradient(90deg, #d90429, #ef233c);
            color: #fff;
            overflow: hidden;
            font-weight: 600;
        }

        .notice-inner {
            padding: 8px 0;
            text-align: center;
            font-size: 14px;
        }


        /* =========================
           NAVBAR
        ========================= */

        header {
            position: sticky;
            top: 0;
            z-index: 9999;
            background: rgba(255,255,255,0.97);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            box-shadow: 0 4px 20px rgba(0,0,0,.06);
        }

        .navbar {
            min-height: 82px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 25px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand img {
            height: 58px;
            width: auto;
        }

        .brand-text h2 {
            color: var(--primary);
            font-size: 20px;
            line-height: 1.2;
            font-weight: 800;
        }

        .brand-text span {
            color: var(--secondary);
            font-size: 11px;
            font-weight: 600;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .nav-links a {
            font-size: 14px;
            font-weight: 600;
            color: var(--dark);
            transition: .3s;
        }

        .nav-links a:hover {
            color: var(--primary);
        }

        .nav-btn {
            background: var(--primary);
            color: white !important;
            padding: 11px 20px;
            border-radius: 8px;
        }

        .nav-btn:hover {
            background: var(--primary-dark);
        }


        /* =========================
           HERO
        ========================= */

        .hero {
            min-height: 650px;
            position: relative;
            display: flex;
            align-items: center;
            background:
                linear-gradient(90deg,
                rgba(0,30,65,.94),
                rgba(0,74,153,.68),
                rgba(0,0,0,.40)),
                url('main-building.jpg');
